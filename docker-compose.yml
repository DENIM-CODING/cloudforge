services:
  postgres:
    image: postgres:16
    container_name: cloudforge-postgres
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data

volumes:
  cloudforge-postgres-data: